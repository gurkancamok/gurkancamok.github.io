<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow">
<title>Portfolio responsive verification</title>
<style>body{margin:0;background:#ddd;font:14px system-ui;color:#14232c}header{padding:14px;display:flex;flex-wrap:wrap;gap:14px;align-items:center}label{display:flex;gap:8px;align-items:center}select{padding:7px}iframe{display:block;border:0;background:#08131c;margin:0 auto;max-width:100%;height:1100px}output{font-size:12px}</style>
</head>
<body>
<header><strong>Responsive verification</strong><label>Width <select id="width"><option>360</option><option selected>390</option><option>768</option><option>1280</option></select></label><label>Page <select id="page"><option value="/">Home</option><option value="/projects/insulin-assistant/">Insulin case study</option><option value="/evidence/">Evidence</option><option value="/profile/">Profile</option></select></label><output id="result" aria-live="polite">Loading</output></header>
<iframe id="preview" title="Portfolio responsive preview" src="/"></iframe>
<script>
const width=document.querySelector('#width'), page=document.querySelector('#page'), frame=document.querySelector('#preview'), result=document.querySelector('#result');
function measure(){const d=frame.contentDocument; if(!d)return; result.textContent=`${frame.clientWidth}px viewport · ${d.documentElement.scrollWidth}px content · ${d.querySelectorAll('h1').length} h1 · ${Array.from(d.images).filter(i=>!i.complete||!i.naturalWidth).length} unloaded images`;}
function update(){frame.style.width=width.value+'px'; if(frame.getAttribute('src')!==page.value){frame.src=page.value;}else{requestAnimationFrame(measure);}}
frame.addEventListener('load',measure); width.addEventListener('change',update);page.addEventListener('change',update); update();
</script>
</body></html>
